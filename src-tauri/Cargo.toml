[package]
name = "btsbots-service"
version = "1.0.0"
description = "BTSBots Zero-Trust Signing Gateway Desktop"
authors = ["BTSBots Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = ["tray-icon"] }
tauri-plugin-shell = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"